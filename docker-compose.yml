services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bo
      POSTGRES_USER: bo
      POSTGRES_PASSWORD: bo
    ports:
      - '${PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bo -d bo']
      interval: 5s
      timeout: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:4.11.0
    profiles: ['storage']
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bo-media
    ports:
      - '9090:9090'

volumes:
  pgdata:
