services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bo
      POSTGRES_USER: bo
      POSTGRES_PASSWORD: bo
    ports:
      - '${PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bo -d bo']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    profiles: ['storage']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
